name: Publish xXenta images

# Proposed workflow, kept out of .github/workflows until the owner enables it: copy it
# to .github/workflows/publish-xxenta-images.yml. Builds the four service images from
# main and pushes them to GHCR under this repository's owner, amd64 only, tagged with
# the commit they were built from. The xXenta chart names one of those tags per
# environment; see docs/deploy/xxenta.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, bot, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR names are lower-case; the owner is not.
      - id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=${REGISTRY}/${OWNER,,}/planning-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
